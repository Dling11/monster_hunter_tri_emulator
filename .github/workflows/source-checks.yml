name: Source bundle checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      # Usage: https://github.com/actions/checkout
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Android source bundle and documentation
        run: python3 .github/scripts/check_repository.py
      - name: Check bounded native logs and emergency fault reporting
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Iruntime/include tests/rowell/bounded_log_check.cpp -o "$RUNNER_TEMP/rowell-log-check"
          "$RUNNER_TEMP/rowell-log-check" "$RUNNER_TEMP/rowell-native-logs"
      - name: Check Android slow-host frame pacing
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Iruntime/include tests/rowell/frame_delta_check.cpp -o "$RUNNER_TEMP/rowell-frame-check"
          "$RUNNER_TEMP/rowell-frame-check"
      - name: Check Android Java log rotation
        run: |
          javac --release 17 -d "$RUNNER_TEMP/rowell-log-java" android/extra/packaging/android/src/com/oceantri/mh3/RowellLogStore.java tests/rowell/RowellLogStoreCheck.java
          java -cp "$RUNNER_TEMP/rowell-log-java" com.oceantri.mh3.RowellLogStoreCheck "$RUNNER_TEMP/rowell-java-logs"
  restore:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $paths=@('dev.ps1','rowell.ps1','scripts/android-source.ps1','scripts/package-phone.ps1','scripts/package-windows.ps1','scripts/test-android-bundle.ps1','scripts/check-audio-recovery.ps1')
          foreach($path in $paths) {
            $issues=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path),[ref]$null,[ref]$issues)
            if($issues) { throw ($issues | Out-String) }
          }
      - name: Restore Android changes against the pinned upstream files
        shell: pwsh
        run: ./scripts/test-android-bundle.ps1
